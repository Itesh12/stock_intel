name: Auto-Trade Bot Cron

on:
  schedule:
    # Run every 5 minutes during Indian Market Hours (9:15 AM - 3:30 PM IST)
    # Mon-Fri: 03:45 UTC to 10:00 UTC
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  trigger-auto-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger StockIntel Auto-Trade Engine
        run: |
          curl -s -X POST "https://stock-intel-two.vercel.app/api/cron/auto-trade?secret=${{ secrets.CRON_SECRET || 'stock_intel_secret_key_12345' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'stock_intel_secret_key_12345' }}" \
            -H "Content-Type: application/json"
